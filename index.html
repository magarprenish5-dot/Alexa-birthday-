<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Experience</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="screen">

  <div class="grid"></div>
  <div class="scan"></div>

  <div class="counter">
    <span id="counter">00</span>
    <small>INITIALIZING</small>
  </div>

  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div id="heart">❤️</div>
  </div>

  <h1 id="title">SYSTEM READY</h1>

  <p id="text">TAP START TO BEGIN</p>

  <button id="start">START EXPERIENCE</button>

  <div id="particles"></div>

</main>

<div id="portal">
  <div class="portalCore"></div>
  <div class="portalRing ring1"></div>
  <div class="portalRing ring2"></div>
  <div class="portalRing ring3"></div>
</div>

<div id="explosion"></div>
<div id="lightningFX"></div>

<div id="holoMessage">
  <span>CONNECTION</span>
  <strong>ESTABLISHED</strong>
</div>

<section id="completionScreen">
  <div class="completeBox">
    <div class="completeIcon">✓</div>
    <div class="systemCompleted">SYSTEM COMPLETED</div>
    <div class="experienceUnlocked">EXPERIENCE UNLOCKED</div>
    <div class="completeBar"><div></div></div>
    <div class="loadingText">PREPARING YOUR GIFT...</div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
