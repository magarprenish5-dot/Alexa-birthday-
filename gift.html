<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Gift For You ❤️</title>
<link rel="stylesheet" href="gift.css">
</head>

<body>

<div class="stars"></div>

<main>

  <div class="smallTitle">
    ✦ A LITTLE SOMETHING ✦
  </div>

  <h1>For You ❤️</h1>

  <p class="sub">
    Something special is waiting inside.
  </p>

  <div class="card" id="card">

    <div class="front">

      <div class="sparkle">✦</div>

      <div class="heart">❤️</div>

      <span>A SPECIAL GIFT</span>

      <h2>Open Me</h2>

      <p>
        Made especially for you.
      </p>

      <button id="openCard">
        OPEN GIFT ✨
      </button>

    </div>


    <div class="inside">

      <div class="heart">❤️</div>

      <span>FOR YOU</span>

      <h2>Dear Sneha</h2>

      <div class="line"></div>

      <p>
        Some people make ordinary
        moments feel extraordinary.
      </p>

      <strong>
        Happy Birthday ❤️
      </strong>

      <small>
        — A little gift from my heart
      </small>

    </div>

  </div>

</main>

<div id="hearts"></div>

<script src="gift.js"></script>

</body>
</html>
